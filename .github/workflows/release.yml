name: Build addon release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to announce (for example v0.0.3)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build versioned addon archive
        run: python3 scripts/package.py
      - name: Check tag matches addon version
        shell: bash
        run: |
          version="$(sed -n 's/^## Version: //p' Roguetastiq.toc)"
          test "${GITHUB_REF_NAME}" = "v${version}"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="${version}" '
            $0 ~ "^## " version " — " { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          args=()
          if [[ "${GITHUB_REF_NAME}" == v0.* ]]; then args+=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" dist/*.zip \
            --title "${GITHUB_REF_NAME}" --notes-file release-notes.md "${args[@]}"
  announce:
    needs: release
    if: always() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/discord-release-reusable.yml
    with:
      project_name: "Roguetastiq"
      tag: ${{ inputs.tag || github.ref_name }}
    secrets:
      FANTASTIQLABS_DISCORD_WEBHOOK: ${{ secrets.FANTASTIQLABS_DISCORD_WEBHOOK }}
