name: Validate addon

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.4
      - name: Check Lua syntax
        run: luac5.4 -p RoguetastiqCatalog.lua RoguetastiqShopping.lua Roguetastiq.lua RoguetastiqOptions.lua
      - name: Test purchase planning
        run: lua5.4 tests/shopping-plan.lua
      - name: Test vendor popup and auto-buy guard
        run: lua5.4 tests/vendor-session.lua
      - name: Build addon archive
        run: python3 scripts/package.py
      - name: Verify packaged shopping module
        run: unzip -l dist/Roguetastiq_0.0.8.zip | grep -F 'Roguetastiq/RoguetastiqShopping.lua'
