name: Validate addon

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.4
      - name: Check Lua syntax
        run: luac5.4 -p RoguetastiqCatalog.lua RoguetastiqSupplies.lua RoguetastiqShopping.lua RoguetastiqMacro.lua RoguetastiqLocations.lua Roguetastiq.lua RoguetastiqPosition.lua RoguetastiqMaps.lua RoguetastiqOptions.lua
      - name: Test Fadeleaf and Flash Powder reminders
        run: lua5.4 tests/supply-reminders.lua
      - name: Test purchase planning
        run: lua5.4 tests/shopping-plan.lua
      - name: Test vendor popup and auto-buy guard
        run: lua5.4 tests/vendor-session.lua
      - name: Test Forever NPC map catalog and projection
        run: lua5.4 tests/map-markers.lua .
      - name: Test macro food references
        run: lua5.4 tests/macro-food.lua .
      - name: Test coating bar position persistence
        run: lua5.4 tests/bar-position.lua
      - name: Build addon archive
        run: python3 scripts/package.py
      - name: Verify packaged shopping module
        run: |
          version="$(sed -n 's/^## Version: //p' Roguetastiq.toc)"
          archive="dist/Roguetastiq_${version}.zip"
          unzip -l "$archive" | grep -F 'Roguetastiq/RoguetastiqShopping.lua'
          unzip -l "$archive" | grep -F 'Roguetastiq/RoguetastiqSupplies.lua'
          unzip -l "$archive" | grep -F 'Roguetastiq/RoguetastiqMacro.lua'
          unzip -l "$archive" | grep -F 'Roguetastiq/RoguetastiqLocations.lua'
          unzip -l "$archive" | grep -F 'Roguetastiq/RoguetastiqPosition.lua'
          unzip -l "$archive" | grep -F 'Roguetastiq/RoguetastiqMaps.lua'
          unzip -l "$archive" | grep -F 'Roguetastiq/RoguetastiqMapPins.xml'
